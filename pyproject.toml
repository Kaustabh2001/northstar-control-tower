[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-control-plane"
version = "0.1.0"
description = "Local-first governance control plane for A2A agentic workflows"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = [
  "packages/contracts/src",
  "services/control-plane-api/src",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [
  "packages/contracts/src",
  "services/control-plane-api/src",
]
testpaths = ["tests"]
