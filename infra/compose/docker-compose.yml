name: northstar

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: northstar
    volumes:
      - ../keycloak/northstar-realm.json:/opt/keycloak/data/import/northstar-realm.json:ro
    ports:
      - "8080:8080"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar
    volumes:
      - northstar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: services/control-plane-api/Dockerfile
    environment:
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://northstar:northstar@postgres:5432/northstar
      NORTHSTAR_AUTH_MODE: keycloak
      NORTHSTAR_AUTH_ISSUER: http://localhost:8080/realms/northstar
      NORTHSTAR_AUTH_JWKS_URL: http://keycloak:8080/realms/northstar/protocol/openid-connect/certs
      NORTHSTAR_AUTH_AUDIENCE: northstar-api
      NORTHSTAR_FIXTURE_MCP_URL: http://fixture-mcp:8000/mcp
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  portal:
    build:
      context: ../..
      dockerfile: apps/portal-web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_AUTH_MODE: keycloak
        VITE_KEYCLOAK_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  fixture-mcp:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: services/fixture-mcp/Dockerfile
    expose:
      - "8000"

volumes:
  northstar-postgres:
