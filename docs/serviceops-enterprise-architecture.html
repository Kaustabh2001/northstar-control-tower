:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;serviceops-enterprise-architecture&quot;&gt;
  &lt;style&gt;
    #serviceops-enterprise-architecture {
      color: var(--foreground);
      width: 100%;
    }

    #serviceops-enterprise-architecture .layer-filter {
      margin-bottom: 12px;
    }

    #serviceops-enterprise-architecture .detail-card {
      margin-bottom: 14px;
    }

    #serviceops-enterprise-architecture .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    #serviceops-enterprise-architecture .detail-head h3 {
      margin: 0;
    }

    #serviceops-enterprise-architecture .detail-description {
      margin: 0 0 10px;
    }

    #serviceops-enterprise-architecture .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    #serviceops-enterprise-architecture .detail-label {
      color: var(--muted-foreground);
      display: block;
      margin-bottom: 3px;
    }

    #serviceops-enterprise-architecture .detail-value {
      margin: 0;
    }

    #serviceops-enterprise-architecture .architecture {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #serviceops-enterprise-architecture .layer-row {
      display: grid;
      grid-template-columns: minmax(132px, 0.26fr) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    #serviceops-enterprise-architecture .layer-row:first-child {
      border-top: 0;
      padding-top: 0;
    }

    #serviceops-enterprise-architecture .layer-name {
      display: flex;
      gap: 7px;
      align-items: flex-start;
    }

    #serviceops-enterprise-architecture .layer-dot,
    #serviceops-enterprise-architecture .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 10px;
      margin-top: 5px;
      background: var(--layer-color);
    }

    #serviceops-enterprise-architecture .layer-title {
      font-weight: 500;
      display: block;
    }

    #serviceops-enterprise-architecture .layer-purpose {

      display: block;
      margin-top: 2px;

    #serviceops-enterprise-architecture .component-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 7px;
    }

    #serviceops-enterprise-architecture .flow-arrow {
      color: var(--muted-foreground);
      text-align: center;
      padding: 1px 0;
    }

    #serviceops-enterprise-architecture .legend {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      align-items: flex-start;
    }

    #serviceops-enterprise-architecture .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    #serviceops-enterprise-architecture .legend-dot {
      margin-top: 0;
    }

    #serviceops-enterprise-architecture .is-hidden {
      display: none;
    }

    @media (max-width: 620px) {
      #serviceops-enterprise-architecture .detail-grid {
        grid-template-columns: 1fr;
      }

      #serviceops-enterprise-architecture .layer-row {
        grid-template-columns: 1fr;
      }

      #serviceops-enterprise-architecture .component-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 390px) {
      #serviceops-enterprise-architecture .component-grid {
        grid-template-columns: 1fr;
      }
    }
  &lt;/style&gt;

  &lt;div class=&quot;viz-controls layer-filter&quot; role=&quot;group&quot; aria-label=&quot;Filter architecture by layer&quot;&gt;&lt;/div&gt;

  &lt;section class=&quot;card detail-card&quot; aria-live=&quot;polite&quot; aria-label=&quot;Selected component details&quot;&gt;
    &lt;div class=&quot;detail-head&quot;&gt;
      &lt;h3 class=&quot;detail-title&quot;&gt;Model gateway and router&lt;/h3&gt;
      &lt;span class=&quot;viz-badge detail-layer&quot;&gt;GenAI orchestration&lt;/span&gt;
    &lt;/div&gt;
    &lt;p class=&quot;detail-description&quot;&gt;&lt;/p&gt;
    &lt;div class=&quot;detail-grid&quot;&gt;
      &lt;div&gt;
        &lt;span class=&quot;detail-label text-small&quot;&gt;Responsibilities&lt;/span&gt;
        &lt;p class=&quot;detail-value detail-responsibility&quot;&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;span class=&quot;detail-label text-small&quot;&gt;Recommended technologies&lt;/span&gt;
        &lt;p class=&quot;detail-value detail-tech&quot;&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;span class=&quot;detail-label text-small&quot;&gt;Key inputs → outputs&lt;/span&gt;
        &lt;p class=&quot;detail-value detail-flow&quot;&gt;&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;architecture&quot; role=&quot;group&quot; aria-label=&quot;ServiceOps enterprise architecture layers&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;viz-row legend text-small&quot; aria-label=&quot;Architecture layer legend&quot;&gt;&lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;serviceops-enterprise-architecture&quot;);
      const layers = [
        {
          id: &quot;experience&quot;,
          name: &quot;Experience &amp; integration&quot;,
          purpose: &quot;Enterprise entry points and system adapters&quot;,
          color: &quot;var(--viz-series-1)&quot;,
          components: [
            {
              name: &quot;ITSM portal &amp; agent console&quot;,
              description: &quot;The existing employee and service-agent interface. AI recommendations appear inside the workflow rather than in a separate chatbot.&quot;,
              responsibility: &quot;Ticket creation, recommendation review, approve/edit/escalate, feedback capture and case history.&quot;,
              tech: &quot;ServiceNow, Jira Service Management, Next.js/React, ServiceNow UI Builder.&quot;,
              flow: &quot;User and ticket context → reviewed action, feedback and ticket updates.&quot;
            },
            {
              name: &quot;API &amp; event gateway&quot;,
              description: &quot;The controlled ingress for synchronous APIs, webhooks and event-driven ticket changes.&quot;,
              responsibility: &quot;Authentication enforcement, rate limits, request validation, routing, idempotency and API versioning.&quot;,
              tech: &quot;Azure API Management, Kong, Apigee, AWS API Gateway; AsyncAPI/OpenAPI.&quot;,
              flow: &quot;ITSM requests and events → authenticated, normalized platform calls.&quot;
            },
            {
              name: &quot;Identity &amp; tenant context&quot;,
              description: &quot;Establishes who is calling, their organization, roles, geography and permitted data scope.&quot;,
              responsibility: &quot;SSO, OIDC tokens, role and group claims, service identities and tenant isolation.&quot;,
              tech: &quot;Microsoft Entra ID, Okta, Keycloak, OAuth 2.0/OIDC, workload identity.&quot;,
              flow: &quot;Identity claims → user, tenant and entitlement context.&quot;
            },
            {
              name: &quot;ITSM connector adapters&quot;,
              description: &quot;Provider-specific adapters isolate ServiceNow, Jira and email schemas from the core platform.&quot;,
              responsibility: &quot;Read tickets, comments and attachments; subscribe to changes; write approved updates.&quot;,
              tech: &quot;ServiceNow REST/Table APIs, Jira REST/webhooks, Microsoft Graph, Apache Camel.&quot;,
              flow: &quot;Provider records ↔ canonical ticket and action contracts.&quot;
            }
          ]
        },
        {
          id: &quot;data&quot;,
          name: &quot;Data &amp; knowledge&quot;,
          purpose: &quot;Governed operational, analytical and retrieval data&quot;,
          color: &quot;var(--viz-series-2)&quot;,
          components: [
            {
              name: &quot;Ingestion &amp; CDC&quot;,
              description: &quot;Continuously ingests ticket changes, comments, knowledge updates and operational events.&quot;,
              responsibility: &quot;Schema validation, deduplication, replay, dead-letter handling and source timestamps.&quot;,
              tech: &quot;Kafka, Azure Event Hubs, AWS MSK, Debezium, Airbyte, Spark Structured Streaming.&quot;,
              flow: &quot;Source mutations → ordered, replayable domain events.&quot;
            },
            {
              name: &quot;Canonical ticket store&quot;,
              description: &quot;The authoritative normalized representation of tickets across source systems.&quot;,
              responsibility: &quot;Current state, event history, SLA fields, assignments, resolution and source lineage.&quot;,
              tech: &quot;PostgreSQL, Azure SQL, Amazon Aurora; JSON Schema and data contracts.&quot;,
              flow: &quot;Normalized events → queryable ticket state and history.&quot;
            },
            {
              name: &quot;Lakehouse &amp; object storage&quot;,
              description: &quot;Stores immutable raw data, curated training tables, attachments and evaluation snapshots.&quot;,
              responsibility: &quot;Bronze/silver/gold zones, time travel, retention, reproducibility and bulk analytics.&quot;,
              tech: &quot;ADLS/S3/GCS, Delta Lake or Apache Iceberg, Databricks or Spark.&quot;,
              flow: &quot;Raw records and artifacts → versioned analytical and training datasets.&quot;
            },
            {
              name: &quot;Knowledge processing&quot;,
              description: &quot;Converts SOPs, runbooks, resolved-ticket summaries and documentation into governed retrieval units.&quot;,
              responsibility: &quot;Parsing, OCR, chunking, metadata enrichment, versioning, freshness and ACL tagging.&quot;,
              tech: &quot;Apache Tika, Unstructured, Azure Document Intelligence, Airflow/Dagster.&quot;,
              flow: &quot;Documents → versioned chunks with provenance and entitlements.&quot;
            },
            {
              name: &quot;CMDB &amp; dependency graph&quot;,
              description: &quot;Provides service, application, asset and dependency context for impact and root-cause reasoning.&quot;,
              responsibility: &quot;Service topology, ownership, criticality, upstream/downstream dependencies and change linkage.&quot;,
              tech: &quot;ServiceNow CMDB, Neo4j, Amazon Neptune, Azure Cosmos DB Gremlin.&quot;,
              flow: &quot;Ticket service/asset IDs → impact graph and owner context.&quot;
            },
            {
              name: &quot;Lexical &amp; vector indexes&quot;,
              description: &quot;Maintains both exact-term and semantic retrieval indexes with document-level access controls.&quot;,
              responsibility: &quot;BM25 search, embedding similarity, metadata filters, freshness and deletion propagation.&quot;,
              tech: &quot;OpenSearch/Elasticsearch plus pgvector, Qdrant, Weaviate or Azure AI Search.&quot;,
              flow: &quot;Governed chunks and embeddings → ranked retrieval candidates.&quot;
            },
            {
              name: &quot;Feature store&quot;,
              description: &quot;Provides consistent online and offline features for classification, routing and SLA models.&quot;,
              responsibility: &quot;Point-in-time correctness, feature lineage, reuse, freshness and skew prevention.&quot;,
              tech: &quot;Feast, Databricks Feature Store, SageMaker Feature Store.&quot;,
              flow: &quot;Ticket/event aggregates → model-ready online and training features.&quot;
            },
            {
              name: &quot;Catalog &amp; lineage&quot;,
              description: &quot;Records dataset ownership, classification, provenance, quality and downstream use.&quot;,
              responsibility: &quot;Data contracts, glossary, lineage, sensitivity tags, quality tests and retention ownership.&quot;,
              tech: &quot;Microsoft Purview, DataHub, OpenMetadata, Collibra, Great Expectations.&quot;,
              flow: &quot;Data assets and jobs → searchable ownership and end-to-end lineage.&quot;
            }
          ]
        },
        {
          id: &quot;ml&quot;,
          name: &quot;Traditional ML&quot;,
          purpose: &quot;Low-cost deterministic prediction services&quot;,
          color: &quot;var(--viz-series-3)&quot;,
          components: [
            {
              name: &quot;Category classifier&quot;,
              description: &quot;Predicts category and subcategory from the ticket text and structured context.&quot;,
              responsibility: &quot;Hierarchical classification, confidence scoring, explanation features and fallback thresholds.&quot;,
              tech: &quot;scikit-learn TF-IDF/logistic regression baseline; LightGBM, XGBoost or embedding classifier.&quot;,
              flow: &quot;Ticket text and metadata → category probabilities and explanation.&quot;
            },
            {
              name: &quot;Assignment recommender&quot;,
              description: &quot;Ranks resolver groups rather than forcing an uncertain single assignment.&quot;,
              responsibility: &quot;Top-k team recommendation, workload-aware ranking and confidence-based manual routing.&quot;,
              tech: &quot;LightGBM/XGBoost ranker, calibrated classifier, Redis/feature store.&quot;,
              flow: &quot;Ticket, service and queue features → ranked resolver groups.&quot;
            },
            {
              name: &quot;SLA-breach predictor&quot;,
              description: &quot;Estimates breach probability and expected remaining time while the ticket is active.&quot;,
              responsibility: &quot;Risk scoring, early warning, contributing factors and intervention thresholds.&quot;,
              tech: &quot;LightGBM/XGBoost, survival analysis, SHAP, MLflow model serving.&quot;,
              flow: &quot;Ticket age, handoffs, backlog and priority → breach risk and remaining-time estimate.&quot;
            },
            {
              name: &quot;Duplicate &amp; major-incident detector&quot;,
              description: &quot;Groups semantically similar tickets and identifies abnormal bursts affecting the same service.&quot;,
              responsibility: &quot;Nearest-neighbour search, clustering, burst detection and major-incident candidate creation.&quot;,
              tech: &quot;Sentence embeddings, HDBSCAN, Isolation Forest, OpenSearch k-NN.&quot;,
              flow: &quot;Incoming ticket stream → duplicate cluster and incident anomaly signal.&quot;
            },
            {
              name: &quot;Calibration &amp; decision thresholds&quot;,
              description: &quot;Turns raw model scores into probabilities that can safely drive policies.&quot;,
              responsibility: &quot;Probability calibration, abstention thresholds, class-specific risk limits and drift checks.&quot;,
              tech: &quot;scikit-learn CalibratedClassifierCV, conformal prediction, Evidently/WhyLabs.&quot;,
              flow: &quot;Raw predictions and validation data → calibrated confidence and allow/escalate decision.&quot;
            }
          ]
        },
        {
          id: &quot;genai&quot;,
          name: &quot;GenAI orchestration&quot;,
          purpose: &quot;Evidence-grounded reasoning under cost and risk controls&quot;,
          color: &quot;var(--viz-series-4)&quot;,
          components: [
            {
              name: &quot;Workflow orchestrator&quot;,
              description: &quot;Runs the deterministic state machine for triage, retrieval, generation, validation and approval.&quot;,
              responsibility: &quot;State, retries, timeouts, checkpoints, compensation, parallel calls and durable execution.&quot;,
              tech: &quot;Temporal, LangGraph, Azure Durable Functions, AWS Step Functions.&quot;,
              flow: &quot;Canonical ticket and policy context → controlled processing state and outcomes.&quot;
            },
            {
              name: &quot;Risk &amp; policy engine&quot;,
              description: &quot;Chooses the permitted path based on ticket sensitivity, action risk, evidence and confidence.&quot;,
              responsibility: &quot;Routing rules, model/data restrictions, human-approval requirements and spend limits.&quot;,
              tech: &quot;Open Policy Agent, Cedar, Drools, configurable decision tables.&quot;,
              flow: &quot;Identity, ticket risk and confidence → allow, constrain, escalate or deny.&quot;
            },
            {
              name: &quot;Prompt service&quot;,
              description: &quot;Supplies reviewed, versioned prompts and task schemas without hardcoding them in application services.&quot;,
              responsibility: &quot;Prompt versions, staging/production labels, rollback, model parameters and trace linkage.&quot;,
              tech: &quot;Langfuse Prompt Management, Git-backed prompt tests, Pydantic/JSON Schema.&quot;,
              flow: &quot;Task and environment → approved prompt, configuration and output schema.&quot;
            },
            {
              name: &quot;Hybrid retriever&quot;,
              description: &quot;Combines lexical, semantic, metadata and entitlement-aware retrieval.&quot;,
              responsibility: &quot;Query rewriting, BM25/vector fusion, ACL filtering, freshness and source diversity.&quot;,
              tech: &quot;OpenSearch/Elasticsearch, pgvector/Qdrant, reciprocal-rank fusion.&quot;,
              flow: &quot;Ticket and query → governed candidate passages and prior resolutions.&quot;
            },
            {
              name: &quot;Reranker&quot;,
              description: &quot;Scores query-document pairs to remove weak context before generation.&quot;,
              responsibility: &quot;Relevance scoring, duplicate removal, diversity and context-budget enforcement.&quot;,
              tech: &quot;Cross-encoder models, Cohere Rerank, Voyage reranker or self-hosted BGE reranker.&quot;,
              flow: &quot;Candidate passages → small, ordered evidence bundle.&quot;
            },
            {
              name: &quot;Model gateway &amp; router&quot;,
              description: &quot;A provider-neutral control point that selects the smallest model expected to pass the task&#x27;s quality gate.&quot;,
              responsibility: &quot;Model selection, budget enforcement, fallback, circuit breakers, quotas and provider failover.&quot;,
              tech: &quot;LiteLLM Proxy or custom gateway; OpenAI/Azure OpenAI, Amazon Bedrock, Vertex AI; RouteLLM-style classifier.&quot;,
              flow: &quot;Risk, complexity, evidence and budget → chosen model, request and usage record.&quot;
            },
            {
              name: &quot;Cache &amp; budget controller&quot;,
              description: &quot;Reuses only validated, version-compatible outputs and enforces per-feature and tenant budgets.&quot;,
              responsibility: &quot;Exact/semantic caching, source-version keys, TTLs, hit safety, token and spend ceilings.&quot;,
              tech: &quot;Redis, provider prompt caching, semantic-cache embeddings, budget service.&quot;,
              flow: &quot;Request fingerprint and knowledge version → cached result or authorized model budget.&quot;
            },
            {
              name: &quot;Response composer&quot;,
              description: &quot;Produces a structured diagnosis, resolution plan, response draft and citations.&quot;,
              responsibility: &quot;Schema-constrained output, concise wording, uncertainty disclosure and action proposal.&quot;,
              tech: &quot;Strong/small LLMs, structured outputs, Pydantic, function/tool calling.&quot;,
              flow: &quot;Ticket, evidence and policy → structured recommendation with citations.&quot;
            },
            {
              name: &quot;Evidence &amp; safety validator&quot;,
              description: &quot;Blocks unsupported claims and unsafe instructions before an agent sees or executes them.&quot;,
              responsibility: &quot;Citation entailment, completeness, groundedness, safety, no-answer and escalation checks.&quot;,
              tech: &quot;NLI models, Ragas/ARES metrics, Azure AI Content Safety, provider moderation, deterministic rules.&quot;,
              flow: &quot;Draft, evidence and policy → pass, repair, abstain or escalate.&quot;
            }
          ]
        },
        {
          id: &quot;action&quot;,
          name: &quot;Human &amp; action layer&quot;,
          purpose: &quot;Controlled decisions and enterprise-system updates&quot;,
          color: &quot;var(--viz-series-5)&quot;,
          components: [
            {
              name: &quot;Agent decision workbench&quot;,
              description: &quot;Shows recommendations with confidence, citations, source freshness and model route.&quot;,
              responsibility: &quot;Approve, edit, reject, request evidence, compare sources and provide structured feedback.&quot;,
              tech: &quot;ServiceNow workspace extension, Jira Forge/Connect app, React/Next.js.&quot;,
              flow: &quot;Validated recommendation → human decision and feedback.&quot;
            },
            {
              name: &quot;Approval workflow&quot;,
              description: &quot;Requires the correct human authority before high-impact or privileged actions.&quot;,
              responsibility: &quot;Four-eyes approval, role-based queues, timeout/escalation and decision reason capture.&quot;,
              tech: &quot;ServiceNow Flow Designer, Camunda, Temporal, Power Automate.&quot;,
              flow: &quot;Risk-tagged proposal → approved, rejected or escalated decision.&quot;
            },
            {
              name: &quot;Tool execution gateway&quot;,
              description: &quot;The only service allowed to call operational tools; the model never receives unrestricted credentials.&quot;,
              responsibility: &quot;Allowlisted tools, argument validation, dry-run, least privilege, idempotency and rollback hooks.&quot;,
              tech: &quot;MCP/function gateway, OPA, HashiCorp Vault, cloud workload identity.&quot;,
              flow: &quot;Approved structured action → authenticated bounded tool call and result.&quot;
            },
            {
              name: &quot;ITSM writer &amp; feedback&quot;,
              description: &quot;Writes final notes, categories, assignments and resolutions back to the system of record.&quot;,
              responsibility: &quot;Optimistic concurrency, duplicate prevention, provenance links and feedback/event emission.&quot;,
              tech: &quot;ServiceNow/Jira APIs, transactional outbox, Kafka/Event Hubs.&quot;,
              flow: &quot;Human-approved result → ITSM update, learning event and audit reference.&quot;
            }
          ]
        },
        {
          id: &quot;observe&quot;,
          name: &quot;Observability &amp; evaluation&quot;,
          purpose: &quot;Trace, measure, compare and improve every decision path&quot;,
          color: &quot;var(--viz-series-6)&quot;,
          components: [
            {
              name: &quot;Langfuse GenAI observability&quot;,
              description: &quot;Provides ticket-level traces across prompts, retrieval, model calls, tools, cost, latency and scores.&quot;,
              responsibility: &quot;Traces/sessions, prompt linkage, token and cost attribution, evaluation, feedback and dashboards.&quot;,
              tech: &quot;Self-hosted or managed Langfuse, OpenTelemetry exporter, ClickHouse/PostgreSQL backend.&quot;,
              flow: &quot;Application spans and scores → searchable traces, experiments and quality/cost dashboards.&quot;
            },
            {
              name: &quot;Platform telemetry&quot;,
              description: &quot;Monitors the health and performance of APIs, queues, workers, stores and dependencies.&quot;,
              responsibility: &quot;Metrics, logs, distributed traces, SLOs, alerts, capacity and error budgets.&quot;,
              tech: &quot;OpenTelemetry Collector, Prometheus, Grafana, Loki, Azure Monitor, Datadog or Splunk.&quot;,
              flow: &quot;Service telemetry → operational dashboards, alerts and incident signals.&quot;
            },
            {
              name: &quot;ML lifecycle &amp; drift&quot;,
              description: &quot;Tracks traditional ML experiments, lineage, production versions and data/prediction drift.&quot;,
              responsibility: &quot;Run tracking, registry, champion/challenger, calibration drift and approval status.&quot;,
              tech: &quot;MLflow, Evidently, WhyLabs, Databricks Model Monitoring.&quot;,
              flow: &quot;Training and inference telemetry → registered versions, drift alerts and rollback candidates.&quot;
            },
            {
              name: &quot;Evaluation &amp; regression&quot;,
              description: &quot;Runs baseline, ML-only, naïve-GenAI and optimized variants on the same locked datasets.&quot;,
              responsibility: &quot;Code metrics, retrieval evaluation, LLM judges, human annotations and release gates.&quot;,
              tech: &quot;Langfuse Datasets/Experiments, Ragas/ARES, pytest, scikit-learn, GitHub Actions.&quot;,
              flow: &quot;Versioned dataset and candidates → paired scores, confidence intervals and pass/fail.&quot;
            },
            {
              name: &quot;FinOps &amp; value dashboard&quot;,
              description: &quot;Combines model, infrastructure, observability and human-effort costs into business unit economics.&quot;,
              responsibility: &quot;Cost per quality-passed ticket, route/model attribution, budgets, savings and ROI assumptions.&quot;,
              tech: &quot;Langfuse Metrics API, OpenCost, cloud billing exports, Power BI/Grafana.&quot;,

        },
        {
          id: &quot;govern&quot;,
          name: &quot;Governance &amp; security&quot;,
          purpose: &quot;Design-time, release-time and runtime controls&quot;,
          color: &quot;color-mix(in srgb, var(--viz-series-1) 55%, var(--viz-series-4))&quot;,
          components: [
            {
              name: &quot;PII, DLP &amp; content controls&quot;,
              description: &quot;Detects and removes sensitive information before model calls and observability export.&quot;,
              responsibility: &quot;PII classification, redaction/tokenization, secret detection and output scanning.&quot;,
              tech: &quot;Microsoft Presidio, cloud DLP services, regex/checksum rules, Azure AI Content Safety.&quot;,
              flow: &quot;Raw ticket and output → classified, minimized and safe content.&quot;
            },
            {

              description: &quot;Enforces user, tenant, document and action permissions at every retrieval and execution boundary.&quot;,
              responsibility: &quot;Least privilege, document ACL filters, segregation of duties and policy decision logging.&quot;,
              tech: &quot;Entra ID/Okta/Keycloak, OPA or Cedar, database row-level security.&quot;,
              flow: &quot;Identity and resource attributes → permit/deny decision with reason.&quot;
            },
            {
              name: &quot;Immutable decision audit&quot;,
              description: &quot;Records what the system knew, decided, recommended and executed without relying on mutable traces.&quot;,
              responsibility: &quot;Prompt/model/ML/KB versions, document hashes, policy result, human decision and tool outcome.&quot;,
              tech: &quot;Append-only PostgreSQL, WORM object storage, S3 Object Lock, cryptographic hashing.&quot;,
              flow: &quot;Decision evidence → tamper-evident audit record and correlation ID.&quot;
            },
            {
              name: &quot;Release &amp; change gates&quot;,
              description: &quot;Prevents prompts, models, policies and knowledge configurations from reaching production without evidence.&quot;,
              responsibility: &quot;Regression thresholds, security tests, approvals, protected labels, canary and rollback.&quot;,

              flow: &quot;Candidate artifact and evaluation report → approved release or blocked change.&quot;

              description: &quot;Applies legal, contractual and tenant-specific lifecycle policies to tickets, traces and derived data.&quot;,

            },
            {

              description: &quot;Maintains ownership, intended use, limitations, risks, controls and approval status for the AI system.&quot;,
              responsibility: &quot;NIST Govern/Map/Measure/Manage evidence, model/vendor inventory and incident response ownership.&quot;,

              flow: &quot;System evidence and incidents → accountable risk decisions and remediation.&quot;
            }
          ]
        },
        {
          id: &quot;platform&quot;,
          name: &quot;Platform &amp; delivery&quot;,
          purpose: &quot;Resilient, scalable and repeatable runtime&quot;,
          color: &quot;color-mix(in srgb, var(--viz-series-2) 55%, var(--viz-series-5))&quot;,
          components: [
            {
              name: &quot;Container runtime&quot;,
              description: &quot;Runs stateless APIs, ML inference, workers, retrieval and policy services with isolation and scaling.&quot;,
              responsibility: &quot;Autoscaling, health checks, resource limits, network policy and workload placement.&quot;,
              tech: &quot;Kubernetes/AKS/EKS/GKE, Docker, Helm, service mesh where justified.&quot;,
              flow: &quot;Signed container images → isolated, scalable application services.&quot;
            },
            {
              name: &quot;Messaging &amp; job queues&quot;,
              description: &quot;Decouples ingestion, indexing, evaluation and long-running workflow tasks.&quot;,
              responsibility: &quot;Backpressure, retries, ordering, dead-letter queues and replay.&quot;,
              tech: &quot;Kafka, Event Hubs, Amazon MSK/SQS, RabbitMQ, Temporal task queues.&quot;,
              flow: &quot;Domain event or job → durable asynchronous processing.&quot;
            },
            {
              name: &quot;Operational data services&quot;,
              description: &quot;Provides transactional state, caching, search, vector storage and object persistence.&quot;,
              responsibility: &quot;HA, backup, encryption, capacity, replication and recovery objectives.&quot;,
              tech: &quot;PostgreSQL/Aurora, Redis, OpenSearch, Qdrant/pgvector, ADLS/S3.&quot;,
              flow: &quot;Runtime reads/writes → durable, recoverable state.&quot;
            },
            {
              name: &quot;CI/CD &amp; infrastructure as code&quot;,
              description: &quot;Builds, scans, tests and promotes application and infrastructure changes through environments.&quot;,
              responsibility: &quot;SBOM, dependency/image scanning, policy checks, signed artifacts, promotion and rollback.&quot;,
              tech: &quot;GitHub Actions/Azure DevOps, Terraform/Bicep, Argo CD/Flux, Trivy/Snyk.&quot;,
              flow: &quot;Reviewed source and configuration → verified environment release.&quot;
            },
            {
              name: &quot;Resilience &amp; continuity&quot;,
              description: &quot;Defines how the service behaves during model, database, region or dependency failures.&quot;,
              responsibility: &quot;Fallback models, circuit breakers, degradation modes, RTO/RPO, backups and disaster tests.&quot;,
              tech: &quot;Multi-zone cloud services, resilience4j/Polly, backup vaults, chaos testing.&quot;,
              flow: &quot;Failure signal → bounded degradation, failover and recoverable operation.&quot;
            }
          ]
        }
      ];

      const architecture = root.querySelector(&quot;.architecture&quot;);
      const filters = root.querySelector(&quot;.layer-filter&quot;);
      const legend = root.querySelector(&quot;.legend&quot;);
      let selectedButton = null;

      const detail = {
        title: root.querySelector(&quot;.detail-title&quot;),
        layer: root.querySelector(&quot;.detail-layer&quot;),
        description: root.querySelector(&quot;.detail-description&quot;),
        responsibility: root.querySelector(&quot;.detail-responsibility&quot;),
        tech: root.querySelector(&quot;.detail-tech&quot;),
        flow: root.querySelector(&quot;.detail-flow&quot;)
      };

      function selectComponent(component, layer, button) {
        if (selectedButton) selectedButton.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
        selectedButton = button;
        selectedButton.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
        detail.title.textContent = component.name;
        detail.layer.textContent = layer.name;
        detail.description.textContent = component.description;
        detail.responsibility.textContent = component.responsibility;
        detail.tech.textContent = component.tech;
        detail.flow.textContent = component.flow;
      }

      function setLayerFilter(layerId, filterButton) {
        filters.querySelectorAll(&quot;button&quot;).forEach((button) =&gt; {
          button.setAttribute(&quot;aria-pressed&quot;, button === filterButton ? &quot;true&quot; : &quot;false&quot;);
        });
        architecture.querySelectorAll(&quot;.layer-row&quot;).forEach((row) =&gt; {
          row.classList.toggle(&quot;is-hidden&quot;, layerId !== &quot;all&quot; &amp;&amp; row.dataset.layer !== layerId);
        });
        architecture.querySelectorAll(&quot;.flow-arrow&quot;).forEach((arrow) =&gt; {
          arrow.classList.toggle(&quot;is-hidden&quot;, layerId !== &quot;all&quot;);
        });
      }

      const allButton = document.createElement(&quot;button&quot;);
      allButton.type = &quot;button&quot;;
      allButton.className = &quot;btn btn-primary&quot;;
      allButton.textContent = &quot;All layers&quot;;
      allButton.setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;);
      allButton.addEventListener(&quot;click&quot;, () =&gt; setLayerFilter(&quot;all&quot;, allButton));
      filters.appendChild(allButton);

      layers.forEach((layer, layerIndex) =&gt; {
        const filterButton = document.createElement(&quot;button&quot;);
        filterButton.type = &quot;button&quot;;
        filterButton.className = &quot;btn&quot;;
        filterButton.textContent = layer.name;
        filterButton.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
        filterButton.addEventListener(&quot;click&quot;, () =&gt; setLayerFilter(layer.id, filterButton));
        filters.appendChild(filterButton);

        if (layerIndex &gt; 0) {
          const arrow = document.createElement(&quot;div&quot;);
          arrow.className = &quot;flow-arrow&quot;;
          arrow.textContent = &quot;↓&quot;;
          arrow.setAttribute(&quot;aria-hidden&quot;, &quot;true&quot;);
          architecture.appendChild(arrow);
        }

        const row = document.createElement(&quot;section&quot;);
        row.className = &quot;layer-row&quot;;
        row.dataset.layer = layer.id;
        row.style.setProperty(&quot;--layer-color&quot;, layer.color);

        const label = document.createElement(&quot;div&quot;);
        label.className = &quot;layer-name&quot;;
        label.innerHTML = &#x27;&lt;span class=&quot;layer-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;span class=&quot;layer-title&quot;&gt;&#x27; +
          layer.name + &#x27;&lt;/span&gt;&lt;span class=&quot;layer-purpose text-small&quot;&gt;&#x27; + layer.purpose + &quot;&lt;/span&gt;&lt;/span&gt;&quot;;

        const grid = document.createElement(&quot;div&quot;);
        grid.className = &quot;component-grid&quot;;
        grid.setAttribute(&quot;role&quot;, &quot;group&quot;);
        grid.setAttribute(&quot;aria-label&quot;, layer.name + &quot; components&quot;);

        layer.components.forEach((component) =&gt; {
          const button = document.createElement(&quot;button&quot;);
          button.type = &quot;button&quot;;
          button.className = &quot;btn viz-tile component&quot;;
          button.textContent = component.name;
          button.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
          button.setAttribute(&quot;aria-label&quot;, component.name + &quot;. &quot; + component.description + &quot; Technologies: &quot; + component.tech);
          button.addEventListener(&quot;click&quot;, () =&gt; selectComponent(component, layer, button));
          grid.appendChild(button);

          if (component.name === &quot;Model gateway &amp; router&quot;) {
            selectComponent(component, layer, button);
          }
        });

        row.appendChild(label);
        row.appendChild(grid);
        architecture.appendChild(row);

        const legendItem = document.createElement(&quot;span&quot;);
        legendItem.className = &quot;legend-item&quot;;
        legendItem.style.setProperty(&quot;--layer-color&quot;, layer.color);
        legendItem.innerHTML = &#x27;&lt;span class=&quot;legend-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span&gt;&#x27; + layer.name + &quot;&lt;/span&gt;&quot;;
        legend.appendChild(legendItem);
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
